name: Build FAISS Vector Index

on:
  workflow_dispatch:

jobs:
  build-faiss:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DOCUMENT_S3_BUCKET: ${{ secrets.DOCUMENT_S3_BUCKET }}
      INDEX_S3_BUCKET: ${{ secrets.INDEX_S3_BUCKET }}
      BUILD_LANGUAGES: ${{ vars.BUILD_LANGUAGES }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS access
        run: |
          echo "Checking caller identity..."
          aws sts get-caller-identity || (echo "No AWS credentials available" && exit 1)
          echo "Listing sample objects in s3://${{ secrets.DOCUMENT_S3_BUCKET }} (first 20)"
          aws s3 ls s3://${{ secrets.DOCUMENT_S3_BUCKET }} --recursive | head -n 20 || true

      - name: Build and upload FAISS indexes (all languages)
        run: python main.py
