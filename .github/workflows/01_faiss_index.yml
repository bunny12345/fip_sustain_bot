name: Build FAISS Vector Index

on:
  workflow_dispatch:

jobs:
  build-faiss:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS access
        run: |
          echo "Checking caller identity..."
          aws sts get-caller-identity || (echo "No AWS credentials available" && exit 1)
          echo "Listing sample objects in s3://fipsustain (first 20)"
          aws s3 ls s3://fipsustain --recursive | head -n 20 || true

      - name: Run FAISS build
        run: python main.py

      - name: Archive FAISS folder
        run: tar -czvf faiss_index.tar.gz -C faiss_index .

      - name: Upload FAISS artifact
        uses: actions/upload-artifact@v4
        with:
          name: faiss_index
          path: faiss_index.tar.gz
